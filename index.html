<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контент для соцсетей — Caviar</title>
  <meta name="theme-color" content="#0d1117">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-brand-accent: #a89974;
      --color-brand-accent-hover: #968758;
      --color-gold-on-light: #85764f;
      --color-surface-light: #f7f7f7;
      --color-surface-dark: #393838;
      --color-ink-deep: #0d1117;
      --color-brand-primary: #06224d;
      --line-gold: rgba(168, 153, 116, 0.35);

      --spacing-section-gap: 64px;
      --spacing-column-gap: 40px;
      --spacing-stats-gap: 14px;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: "Nunito Sans", sans-serif; background: var(--color-surface-light); color: var(--color-surface-dark); overflow-x: hidden; }
    img { display: block; max-width: 100%; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    /* ===== Hero ===== */
    .hero {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--spacing-column-gap);
      min-height: 420px;
      padding: 96px var(--spacing-section-gap) var(--spacing-section-gap);
      overflow: hidden;
      background:
        radial-gradient(120% 100% at 30% 15%, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%),
        radial-gradient(140% 120% at 70% 115%, #041a3c 0%, var(--color-ink-deep) 60%);
      isolation: isolate;
    }
    .hero__title { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; gap: var(--spacing-stats-gap); max-width: 760px; }
    .hero__microheader { font-weight: 700; font-size: 14px; line-height: 14px; letter-spacing: 0.14px; text-transform: uppercase; color: var(--color-brand-accent); }
    .hero__display { font-weight: 800; font-size: 76px; line-height: 1.02; letter-spacing: -0.76px; text-transform: uppercase; color: var(--color-surface-light); }
    .hero__mask { display: block; overflow: hidden; }
    .hero__mask > span { display: block; transform: translateY(1.2em); transition: transform 1.1s var(--ease-out-expo); transition-delay: var(--d, 0s); }
    .hero.is-loaded .hero__mask > span, html:not(.js) .hero__mask > span { transform: none; }
    .hero__lead { margin-top: 10px; max-width: 560px; font-size: 17px; line-height: 24px; letter-spacing: 0.17px; color: rgba(247,247,247,0.9); }
    .hero__stats { position: relative; z-index: 2; display: flex; gap: 48px; }
    .stat { display: flex; flex-direction: column; gap: 6px; }
    .stat__value { font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -2px; color: var(--color-brand-accent); font-variant-numeric: tabular-nums; }
    .stat__label { font-weight: 700; font-size: 12px; line-height: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(247,247,247,0.7); }
    .hero__lines { position: absolute; right: -80px; top: -40px; width: 620px; height: 620px; z-index: 1; opacity: 0.22; pointer-events: none; }

    /* ===== Панель управления ===== */
    .controls {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px 32px;
      padding: 18px var(--spacing-section-gap);
      background: rgba(255,255,255,0.94);
      backdrop-filter: saturate(140%) blur(10px);
      -webkit-backdrop-filter: saturate(140%) blur(10px);
      border-bottom: 1px solid var(--line-gold);
    }
    .controls__group { display: flex; align-items: center; gap: 14px; }
    .controls__label { font-weight: 700; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-gold-on-light); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px; min-height: 37px; padding: 0 18px;
      border: 1px solid var(--color-brand-accent); border-radius: 50px;
      font-size: 13px; line-height: 24px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--color-surface-dark);
      transition: background-color .25s ease, color .25s ease;
    }
    .chip:hover { background: rgba(168,153,116,0.12); }
    .chip[aria-pressed="true"] { background: var(--color-brand-accent); color: #fff; }
    .chip__count { font-size: 11px; opacity: .7; letter-spacing: .05em; }

    .lang { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 13px; letter-spacing: 1.3px; text-transform: uppercase; }
    .lang__side { color: rgba(57,56,56,0.4); transition: color .25s ease; }
    .lang__side.is-active { color: var(--color-surface-dark); }
    .switch { position: relative; width: 56px; height: 30px; border-radius: 50px; background: var(--color-ink-deep); border: 1px solid var(--color-brand-accent); }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
      background: var(--color-brand-accent); transition: transform .35s var(--ease-out-expo);
    }
    .switch[aria-checked="true"]::after { transform: translateX(26px); }
    .switch:focus-visible, .chip:focus-visible, .btn:focus-visible, .tile__dl:focus-visible { outline: 2px solid var(--color-brand-accent); outline-offset: 3px; }

    /* ===== Коллекции ===== */
    .feed { padding: 24px var(--spacing-section-gap) 96px; }
    .collection { padding: 48px 0 8px; border-bottom: 1px solid var(--line-gold); }
    .collection:last-child { border-bottom: 0; }
    .collection__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
    .collection__meta { display: flex; flex-direction: column; gap: var(--spacing-stats-gap); }
    .collection__eyebrow { font-weight: 700; font-size: 14px; line-height: 14px; text-transform: uppercase; color: var(--color-gold-on-light); letter-spacing: .14px; }
    .collection__title { font-weight: 700; font-size: 52px; line-height: 52px; letter-spacing: -1.04px; color: var(--color-surface-dark); }
    .collection__new { display: inline-block; margin-left: 14px; vertical-align: middle; padding: 4px 12px; border-radius: 50px; background: var(--color-brand-accent); color: #fff; font-size: 11px; line-height: 16px; letter-spacing: .12em; font-weight: 700; text-transform: uppercase; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      padding: 14px 36px; background: var(--color-brand-accent);
      font-weight: 700; font-size: 13px; line-height: 20px; letter-spacing: 0.7px; text-transform: uppercase; color: #fff; text-decoration: none;
      transition: background-color .25s ease;
    }
    .btn:hover { background: var(--color-brand-accent-hover); }
    .btn svg { width: 16px; height: 16px; flex: 0 0 16px; }
    .btn[disabled] { opacity: .6; cursor: progress; }

    .group + .group { margin-top: 36px; }
    .group__label { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-surface-dark); }
    .group__note { font-weight: 400; letter-spacing: .04em; text-transform: none; color: var(--color-gold-on-light); }
    .group__label::after { content: ""; flex: 1; height: 1px; background: var(--line-gold); }

    .grid { display: grid; gap: 20px; }
    .grid--posts, .grid--ads { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .grid--stories { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }

    .tile { position: relative; background: #fff; box-shadow: 0 10px 30px rgba(13,17,23,0.08); }
    .tile__open { display: block; width: 100%; overflow: hidden; background: #e9e7e2; cursor: zoom-in; }
    .tile__open img { width: 100%; height: auto; transition: transform .8s var(--ease-out-expo); }
    .tile:hover .tile__open img { transform: scale(1.03); }
    .tile__open { position: relative; }
    .tile__play {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(13,17,23,.55); border: 1px solid var(--color-brand-accent); color: #fff;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); pointer-events: none;
    }
    .tile__play svg { width: 18px; height: 18px; margin-left: 3px; }
    .tile__dur {
      position: absolute; right: 10px; bottom: 10px; padding: 3px 8px; background: rgba(13,17,23,.7);
      font-weight: 700; font-size: 11px; letter-spacing: .08em; color: #fff; pointer-events: none;
    }
    .tile__bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; }
    .tile__name { font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #6b6b73; }
    .tile__dl {
      display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px;
      border: 1px solid var(--color-brand-accent); color: var(--color-gold-on-light);
      font-weight: 700; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none;
      transition: background-color .25s ease, color .25s ease;
    }
    .tile__dl:hover { background: var(--color-brand-accent); color: #fff; }
    .tile__dl svg { width: 13px; height: 13px; }
    .tile__name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .grid--stories .tile__bar, .grid--ads .tile__bar { flex-direction: column; align-items: stretch; gap: 8px; }
    .grid--stories .tile__dl, .grid--ads .tile__dl { justify-content: center; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; z-index: 60; width: max-content; max-width: calc(100% - 32px);
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      padding: 14px 20px; background: var(--color-ink-deep); border: 1px solid var(--color-brand-accent);
      font-size: 14px; line-height: 20px; color: var(--color-surface-light); text-align: center;
      transition: opacity .3s ease, transform .4s var(--ease-out-expo);
    }
    .toast.is-shown { opacity: 1; transform: translate(-50%, 0); }
    .empty { padding: 96px 0; text-align: center; font-size: 17px; line-height: 24px; color: #6b6b73; }

    /* ===== Просмотр ===== */
    .viewer { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 40px; background: rgba(13,17,23,0.94); }
    .viewer.is-open { display: flex; }
    .viewer__inner { display: flex; flex-direction: column; align-items: center; gap: 18px; max-height: 100%; }
    .viewer video { max-width: min(90vw, 1080px); max-height: calc(100vh - 160px); width: auto; height: auto; background: #000; box-shadow: 0 40px 80px rgba(0,0,0,.55); }
    .viewer [hidden] { display: none; }
    .viewer img { max-width: min(90vw, 1080px); max-height: calc(100vh - 160px); width: auto; height: auto; box-shadow: 0 40px 80px rgba(0,0,0,.55); }
    .viewer__caption { font-weight: 700; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: rgba(247,247,247,.75); text-align: center; }
    .viewer__close, .viewer__nav { position: absolute; width: 48px; height: 48px; display: grid; place-items: center; color: var(--color-surface-light); border: 1px solid var(--line-gold); border-radius: 50%; transition: background-color .25s ease; }
    .viewer__close:hover, .viewer__nav:hover { background: rgba(168,153,116,.2); }
    .viewer__close { top: 24px; right: 24px; }
    .viewer__nav--prev { left: 24px; top: 50%; transform: translateY(-50%); }
    .viewer__nav--next { right: 24px; top: 50%; transform: translateY(-50%); }
    .viewer svg { width: 18px; height: 18px; }

    /* ===== Reveal ===== */
    .reveal { opacity: 0; transform: translateY(26px); transition: opacity 0.7s ease, transform 0.7s ease; transition-delay: var(--d, 0s); }
    .reveal.visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1; transform: none; transition: none; }
      .hero__mask > span { transform: none !important; transition: none; }
      .tile__open img, .switch::after { transition: none; }
    }

    /* ===== Адаптив ===== */
    @media (max-width: 1100px) {
      .hero { flex-direction: column; align-items: flex-start; min-height: 0; padding-top: 72px; }
      .hero__display { font-size: 52px; }
      .collection__title { font-size: 40px; line-height: 1.1; }
    }
    @media (max-width: 640px) {
      .hero { padding: 56px 24px 40px; }
      .hero__display { font-size: 36px; letter-spacing: -0.36px; }
      .hero__stats { gap: 28px; }
      .stat__value { font-size: 44px; }
      .controls { padding: 12px 16px; gap: 12px; }
      .controls__label { display: none; }
      .chip { padding: 0 14px; min-height: 34px; font-size: 12px; letter-spacing: 1px; }
      .feed { padding: 8px 16px 64px; }
      .collection { padding-top: 36px; }
      .collection__title { font-size: 32px; }
      .collection__head .btn { width: 100%; }
      .grid { gap: 12px; }
      .grid--posts, .grid--stories, .grid--ads { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile__bar { flex-direction: column; align-items: stretch; padding: 8px; }
      .tile__dl { justify-content: center; }
      .viewer { padding: 16px; }
      .viewer__nav { display: none; }
    }
  </style>

  <script>document.documentElement.className += ' js';</script>
  <noscript><style>.reveal { opacity: 1; transform: none; }</style></noscript>
</head>
<body>

  <!-- Меню и подвал не входят в вёрстку — подключаются шаблоном сайта -->

  <section class="hero" id="hero">
    <svg class="hero__lines" viewBox="0 0 600 600" aria-hidden="true">
      <g fill="none" stroke="#a89974" stroke-width="1">
        <path d="M600 0 L0 600"/><path d="M600 0 L60 600"/><path d="M600 0 L130 600"/><path d="M600 0 L210 600"/>
        <path d="M600 0 L300 600"/><path d="M600 0 L400 600"/><path d="M600 0 L510 600"/>
      </g>
    </svg>
    <div class="hero__title">
      <p class="hero__microheader"><span class="hero__mask"><span style="--d: 0.15s">Caviar · Для менеджеров</span></span></p>
      <h1 class="hero__display">
        <span class="hero__mask"><span style="--d: 0.3s">Посты и сторис</span></span>
        <span class="hero__mask"><span style="--d: 0.45s">для соцсетей</span></span>
      </h1>
      <p class="hero__lead"><span class="hero__mask"><span style="--d: 0.6s">Готовые публикации Caviar в полном разрешении: для ваших страниц и для переписки с клиентами. Новые коллекции — сверху.</span></span></p>
    </div>
    <div class="hero__stats reveal" style="--d: .5s">
      <div class="stat"><span class="stat__value" id="statCollections">0</span><span class="stat__label">Коллекций</span></div>
      <div class="stat"><span class="stat__value" id="statPosts">0</span><span class="stat__label">Постов</span></div>
      <div class="stat"><span class="stat__value" id="statStories">0</span><span class="stat__label">Сторис</span></div>
      <div class="stat"><span class="stat__value" id="statVideos">0</span><span class="stat__label">Видео</span></div>
    </div>
  </section>

  <div class="controls" role="toolbar" aria-label="Фильтры">
    <div class="controls__group">
      <span class="controls__label">Показать</span>
      <div class="chips" id="kindChips">
        <button class="chip" type="button" data-kind="all" aria-pressed="true">Всё <span class="chip__count" data-count="all"></span></button>
        <button class="chip" type="button" data-kind="posts" aria-pressed="false">Посты <span class="chip__count" data-count="posts"></span></button>
        <button class="chip" type="button" data-kind="stories" aria-pressed="false">Сторис <span class="chip__count" data-count="stories"></span></button>
        <button class="chip" type="button" data-kind="ads" aria-pressed="false" hidden>Реклама <span class="chip__count" data-count="ads"></span></button>
      </div>
    </div>
    <div class="controls__group">
      <span class="controls__label">Язык</span>
      <div class="lang">
        <span class="lang__side is-active" data-lang-label="ru">Рус</span>
        <button class="switch" id="langSwitch" type="button" role="switch" aria-checked="false" aria-label="Английская версия"></button>
        <span class="lang__side" data-lang-label="en">Eng</span>
      </div>
    </div>
  </div>

  <main class="feed" id="feed" aria-live="polite"></main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Просмотр изображения">
    <button class="viewer__close" type="button" data-close aria-label="Закрыть">
      <svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <button class="viewer__nav viewer__nav--prev" type="button" data-step="-1" aria-label="Предыдущее">
      <svg viewBox="0 0 16 16"><path d="M10 2L4 8l6 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div class="viewer__inner">
      <img id="viewerImg" alt="">
      <video id="viewerVideo" controls playsinline preload="metadata" hidden></video>
      <p class="viewer__caption" id="viewerCaption"></p>
      <a class="btn" id="viewerDl" href="#" download>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0 3.5-3.5M8 10 4.5 6.5M2.5 13.5h11"/></svg>
        Скачать
      </a>
    </div>
    <button class="viewer__nav viewer__nav--next" type="button" data-step="1" aria-label="Следующее">
      <svg viewBox="0 0 16 16"><path d="M6 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/content.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script>
  (function () {
    var DATA = window.CONTENT || [];
    var KIND = { posts: 'Пост', stories: 'Сторис', ads: 'Креатив' };
    var KIND_PL = { posts: 'Посты', stories: 'Сторис', ads: 'Рекламные креативы' };
    var KIND_FILE = { posts: 'post', stories: 'story', ads: 'ad' };
    var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    var DL_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8m0 0 3.5-3.5M8 10 4.5 6.5M2.5 13.5h11"/></svg>';

    // На телефонах сохраняем через системное меню «Поделиться»: на iPhone там есть
    // «Сохранить изображение», которое кладёт файл в Фото, а не в «Файлы».
    var SHARE = (function () {
      try {
        return window.matchMedia('(pointer: coarse)').matches && !!navigator.canShare &&
          navigator.canShare({ files: [new File([''], 'a.jpg', { type: 'image/jpeg' })] });
      } catch (e) { return false; }
    })();

    var state = { kind: 'all', lang: 'ru' };
    try {
      var saved = JSON.parse(localStorage.getItem('caviar-social') || '{}');
      if (saved.kind) state.kind = saved.kind;
      if (saved.lang) state.lang = saved.lang;
    } catch (e) {}

    var feed = document.getElementById('feed');
    var visible = []; // плоский список показанных изображений — для пролистывания в просмотре

    function fmtDate(iso) {
      if (!iso) return '';
      var p = iso.split('-');
      return +p[2] + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0];
    }
    function isVideo(it) { return it.type === 'video'; }
    function src(it) { return it.file + (isVideo(it) ? '.mp4' : '.jpg'); }
    function num(it) { return String(it.num || it.n).padStart(2, '0'); }
    function fileName(c, it) {
      return 'caviar_' + c.slug + '_' + KIND_FILE[it.kind] + '_' + it.lang + '_' + num(it) + (isVideo(it) ? '.mp4' : '.jpg');
    }
    function fmtDur(sec) { sec = Math.round(sec || 0); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); }

    // Изображения коллекции нужного типа на выбранном языке; если такой версии нет — на другом
    function pick(c, k) {
      var by = function (l) { return c.items.filter(function (it) { return it.kind === k && it.lang === l; }); };
      var items = by(state.lang), fallback = false;
      if (!items.length) { items = by(state.lang === 'ru' ? 'en' : 'ru'); fallback = items.length > 0; }
      items.sort(function (a, b) { return (a.pos || a.n) - (b.pos || b.n); });
      items.forEach(function (it, i) { it.num = i + 1; }); // номер слайда в публикации, с учётом видео
      return { items: items, fallback: fallback };
    }

    // Статистика по выбранному языку
    function counts() {
      var r = { posts: 0, stories: 0, ads: 0 };
      DATA.forEach(function (c) { ['posts', 'stories', 'ads'].forEach(function (k) { r[k] += pick(c, k).items.length; }); });
      r.all = r.posts + r.stories + r.ads;
      r.videos = 0;
      DATA.forEach(function (c) { ['posts', 'stories', 'ads'].forEach(function (k) {
        r.videos += pick(c, k).items.filter(isVideo).length; }); });
      return r;
    }

    function render() {
      visible = [];
      var html = '';
      var newest = DATA.length ? DATA[0].date : null;
      var kinds = state.kind === 'all' ? ['posts', 'stories', 'ads'] : [state.kind];

      DATA.forEach(function (c) {
        var groups = '';
        var total = 0;
        kinds.forEach(function (k) {
          var picked = pick(c, k), items = picked.items;
          if (!items.length) return;
          total += items.length;
          groups += '<div class="group"><p class="group__label">' + KIND_PL[k] + ' · ' + items.length +
            (picked.fallback ? ' <span class="group__note">' + (state.lang === 'en' ? 'Английской версии нет — показана русская' : 'Русской версии нет — показана английская') + '</span>' : '') + '</p><div class="grid grid--' + k + '">';
          items.forEach(function (it) {
            var idx = visible.length;
            visible.push({ c: c, it: it });
            var label = KIND[k] + ' ' + num(it) + (isVideo(it) ? ' · видео' : '') + (it.label ? ' · ' + it.label : '');
            groups += '<figure class="tile reveal">' +
              '<button class="tile__open" type="button" data-idx="' + idx + '" aria-label="Открыть: ' + esc(c.title) + ', ' + label + '">' +
              '<img src="' + it.file + '.webp" width="' + it.w + '" height="' + it.h + '" loading="lazy" decoding="async" alt="' + esc(c.title) + ' — ' + label.toLowerCase() + '">' +
              (isVideo(it) ? '<span class="tile__play"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></span><span class="tile__dur">' + fmtDur(it.duration) + '</span>' : '') +
              '</button>' +
              '<figcaption class="tile__bar"><span class="tile__name">' + label + '</span>' +
              '<a class="tile__dl" href="' + src(it) + '" download="' + fileName(c, it) + '">' + DL_ICON + (SHARE ? 'Сохранить' : 'Скачать') + '</a></figcaption>' +
              '</figure>';
          });
          groups += '</div></div>';
        });
        if (!total) return;
        html += '<section class="collection" data-slug="' + c.slug + '">' +
          '<div class="collection__head reveal">' +
            '<div class="collection__meta">' +
              '<p class="collection__eyebrow">' + fmtDate(c.date) + '</p>' +
              '<h2 class="collection__title">' + esc(c.title) + (c.date === newest ? '<span class="collection__new">Новое</span>' : '') + '</h2>' +
            '</div>' +
            '<button class="btn" type="button" data-zip="' + c.slug + '">' + DL_ICON + (SHARE ? 'Сохранить все · ' : 'Скачать все · ') + total + '</button>' +
          '</div>' + groups + '</section>';
      });

      feed.innerHTML = html || '<p class="empty">Для выбранного фильтра пока нет материалов.</p>';
      observe();
      syncControls();
    }

    function syncControls() {
      var n = counts();
      document.querySelectorAll('#kindChips .chip').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.kind === state.kind));
      });
      document.querySelectorAll('[data-count]').forEach(function (el) { el.textContent = n[el.dataset.count]; });
      document.querySelector('[data-kind="ads"]').hidden = !n.ads && state.kind !== 'ads';
      var sw = document.getElementById('langSwitch');
      sw.setAttribute('aria-checked', String(state.lang === 'en'));
      document.querySelectorAll('[data-lang-label]').forEach(function (el) {
        el.classList.toggle('is-active', el.dataset.langLabel === state.lang);
      });
      document.documentElement.lang = state.lang;
      setStat('statCollections', DATA.length);
      setStat('statPosts', n.posts);
      setStat('statStories', n.stories);
      setStat('statVideos', n.videos);
      try { localStorage.setItem('caviar-social', JSON.stringify(state)); } catch (e) {}
    }
    function setStat(id, v) { document.getElementById(id).textContent = v; }

    // Фильтры
    document.getElementById('kindChips').addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      state.kind = b.dataset.kind; render();
    });
    document.getElementById('langSwitch').addEventListener('click', function () {
      state.lang = state.lang === 'ru' ? 'en' : 'ru'; render();
    });
    document.querySelectorAll('[data-lang-label]').forEach(function (el) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', function () { state.lang = el.dataset.langLabel; render(); });
    });

    // Скачать коллекцию одним архивом
    feed.addEventListener('click', function (e) {
      var zipBtn = e.target.closest('[data-zip]');
      if (zipBtn) { SHARE ? shareCollection(zipBtn) : downloadZip(zipBtn); return; }
      var dl = e.target.closest('.tile__dl');
      if (dl && SHARE) { e.preventDefault(); shareFiles([{ href: dl.getAttribute('href'), name: dl.getAttribute('download') }], dl); return; }
      var open = e.target.closest('.tile__open');
      if (open) openViewer(+open.dataset.idx);
    });

    function downloadZip(btn) {
      var c = DATA.filter(function (x) { return x.slug === btn.dataset.zip; })[0];
      var items = visible.filter(function (v) { return v.c === c; }).map(function (v) { return v.it; });
      var label = btn.innerHTML;
      if (!window.JSZip) { items.forEach(function (it, i) { setTimeout(function () { triggerDl(src(it), fileName(c, it)); }, i * 350); }); return; }
      btn.disabled = true; btn.innerHTML = DL_ICON + 'Готовим архив…';
      var zip = new JSZip();
      Promise.all(items.map(function (it) {
        return fetch(src(it)).then(function (r) { return r.blob(); }).then(function (b) { zip.file(fileName(c, it), b); });
      })).then(function () { return zip.generateAsync({ type: 'blob' }); })
        .then(function (blob) {
          var suffix = state.kind === 'all' ? '' : '_' + state.kind;
          triggerDl(URL.createObjectURL(blob), 'caviar_' + c.slug + suffix + '_' + state.lang + '.zip');
        })
        .catch(function () { items.forEach(function (it, i) { setTimeout(function () { triggerDl(src(it), fileName(c, it)); }, i * 350); }); })
        .then(function () { btn.disabled = false; btn.innerHTML = label; });
    }
    function triggerDl(href, name) {
      var a = document.createElement('a'); a.href = href; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    }

    // ===== Сохранение в Фото (телефоны) =====
    var files = {};   // href -> File (готовые)
    var loading = {}; // href -> Promise<File>
    function loadFile(x) {
      if (files[x.href]) return Promise.resolve(files[x.href]);
      if (!loading[x.href]) {
        loading[x.href] = fetch(x.href).then(function (r) { return r.blob(); }).then(function (b) {
          files[x.href] = new File([b], x.name, { type: /\.mp4$/.test(x.name) ? 'video/mp4' : 'image/jpeg' });
          return files[x.href];
        });
        loading[x.href].catch(function () { delete loading[x.href]; });
      }
      return loading[x.href];
    }
    function collectionFiles(slug) {
      return visible.filter(function (v) { return v.c.slug === slug; })
        .map(function (v) { return { href: src(v.it), name: fileName(v.c, v.it) }; });
    }
    function shareFiles(list, btn) {
      var ready = list.every(function (x) { return files[x.href]; });
      if (ready) {
        // Вызов прямо в обработчике нажатия — иначе Safari не откроет меню
        navigator.share({ files: list.map(function (x) { return files[x.href]; }) })
          .then(function () { if (btn) btn.classList.remove('is-ready'); })
          .catch(function (err) {
            if (err && err.name === 'AbortError') return;
            list.forEach(function (x) { triggerDl(x.href, x.name); });
          });
        hint();
        return;
      }
      var label = btn ? btn.innerHTML : '';
      if (btn) { btn.style.pointerEvents = 'none'; btn.innerHTML = DL_ICON + 'Загружаем…'; }
      Promise.all(list.map(loadFile)).then(function (fs) {
        if (btn) { btn.style.pointerEvents = ''; btn.innerHTML = label; }
        return navigator.share({ files: fs }).then(function () {}, function (err) {
          if (err && err.name === 'AbortError') return;
          // Загрузка заняла время, и Safari потерял нажатие — просим нажать ещё раз, файлы уже готовы
          if (btn) { btn.innerHTML = DL_ICON + 'Готово — нажмите ещё раз'; }
          toast('Изображения загружены. Нажмите кнопку ещё раз.');
        });
      }, function () {
        if (btn) { btn.style.pointerEvents = ''; btn.innerHTML = label; }
        list.forEach(function (x) { triggerDl(x.href, x.name); });
      });
      hint();
    }
    function shareCollection(btn) { shareFiles(collectionFiles(btn.dataset.zip), btn); }

    // Начинаем загрузку ещё при касании — к моменту отпускания файл часто уже готов
    if (SHARE) {
      document.addEventListener('touchstart', function (e) {
        var dl = e.target.closest('.tile__dl');
        if (dl) loadFile({ href: dl.getAttribute('href'), name: dl.getAttribute('download') });
        var z = e.target.closest('[data-zip]');
        if (z) collectionFiles(z.dataset.zip).forEach(loadFile);
      }, { passive: true });
    }

    var toastEl = document.getElementById('toast'), toastTimer;
    function toast(text) {
      toastEl.textContent = text; toastEl.classList.add('is-shown');
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('is-shown'); }, 4000);
    }
    var hinted = false;
    function hint() {
      if (hinted) return; hinted = true;
      try { if (localStorage.getItem('caviar-social-hint')) return; localStorage.setItem('caviar-social-hint', '1'); } catch (e) {}
      toast('В меню выберите «Сохранить изображение» — фото появится в Фотоплёнке.');
    }

    // Просмотр
    var viewer = document.getElementById('viewer');
    var vImg = document.getElementById('viewerImg');
    var vVid = document.getElementById('viewerVideo');
    var vCap = document.getElementById('viewerCaption');
    var vDl = document.getElementById('viewerDl');
    var cur = 0;
    function openViewer(i) {
      cur = (i + visible.length) % visible.length;
      var v = visible[cur];
      var video = isVideo(v.it);
      vVid.pause();
      vImg.hidden = video; vVid.hidden = !video;
      if (video) { vImg.removeAttribute('src'); vVid.poster = v.it.file + '.webp'; vVid.src = src(v.it); vVid.play().catch(function () {}); }
      else { vVid.removeAttribute('src'); vVid.load(); vImg.src = src(v.it); }
      vImg.alt = v.c.title + ' — ' + KIND[v.it.kind].toLowerCase() + ' ' + num(v.it);
      vCap.textContent = v.c.title + ' · ' + KIND[v.it.kind] + ' ' + num(v.it) + (video ? ' · видео' : '') + (v.it.label ? ' · ' + v.it.label : '') + ' · ' + v.it.lang.toUpperCase();
      vDl.href = src(v.it);
      vDl.setAttribute('download', fileName(v.c, v.it));
      if (SHARE && !video) loadFile({ href: vDl.getAttribute('href'), name: vDl.getAttribute('download') });
      viewer.classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }
    if (SHARE) {
      vDl.lastChild.textContent = ' Сохранить в Фото';
      vDl.addEventListener('click', function (e) {
        e.preventDefault();
        shareFiles([{ href: vDl.getAttribute('href'), name: vDl.getAttribute('download') }], null);
      });
    }
    function closeViewer() {
      viewer.classList.remove('is-open'); document.body.style.overflow = '';
      vImg.removeAttribute('src'); vVid.pause(); vVid.removeAttribute('src'); vVid.load();
    }
    viewer.addEventListener('click', function (e) {
      if (e.target === viewer || e.target.closest('[data-close]')) return closeViewer();
      var s = e.target.closest('[data-step]'); if (s) openViewer(cur + +s.dataset.step);
    });
    document.addEventListener('keydown', function (e) {
      if (!viewer.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeViewer();
      if (e.key === 'ArrowRight') openViewer(cur + 1);
      if (e.key === 'ArrowLeft') openViewer(cur - 1);
    });

    // Reveal
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var obs = 'IntersectionObserver' in window && !reduce ? new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('visible'); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -5% 0px' }) : null;
    function observe() {
      document.querySelectorAll('.reveal:not(.visible)').forEach(function (el) {
        if (obs) obs.observe(el); else el.classList.add('visible');
      });
    }

    render();
    var hero = document.getElementById('hero');
    requestAnimationFrame(function () { requestAnimationFrame(function () { hero.classList.add('is-loaded'); }); });
  })();
  </script>
</body>
</html>
